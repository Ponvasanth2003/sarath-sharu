<script>
	$(window).load(function () {
		$('.loading').fadeOut('fast');
		$('.container').fadeIn('fast');
	});
	$('document').ready(function () {
		var vw;
		$(window).resize(function () {
			vw = $(window).width() / 2;
			$('#b1,#b2,#b3,#b4,#b5,#b6,#b7,#b8,#b9').stop();
			$('#b11').animate({ top: 240, left: vw - 400 }, 500);
			$('#b22').animate({ top: 240, left: vw - 300 }, 500);
			$('#b33').animate({ top: 240, left: vw - 200 }, 500);
			$('#b44').animate({ top: 240, left: vw - 100 }, 500);
			$('#b55').animate({ top: 240, left: vw }, 500);
			$('#b66').animate({ top: 240, left: vw + 100 }, 500);
			$('#b77').animate({ top: 240, left: vw + 200 }, 500);
			$('#b88').animate({ top: 240, left: vw + 300 }, 500);
			$('#b99').animate({ top: 240, left: vw + 400 }, 500);
		});

		$('#turn_on').click(function () {
			$('#bulb_yellow').addClass('bulb-glow-yellow');
			$('#bulb_red').addClass('bulb-glow-red');
			$('#bulb_blue').addClass('bulb-glow-blue');
			$('#bulb_green').addClass('bulb-glow-green');
			$('#bulb_pink').addClass('bulb-glow-pink');
			$('#bulb_orange').addClass('bulb-glow-orange');
			$('body').addClass('peach');
			$(this).fadeOut('fast').delay(3000).promise().done(function () {
				$('#play').fadeIn('fast');
			});
		});
		$('#play').click(function () {
			var audio = $('.song')[0];
			audio.play();
			$('#bulb_yellow').addClass('bulb-glow-yellow-after');
			$('#bulb_red').addClass('bulb-glow-red-after');
			$('#bulb_blue').addClass('bulb-glow-blue-after');
			$('#bulb_green').addClass('bulb-glow-green-after');
			$('#bulb_pink').addClass('bulb-glow-pink-after');
			$('#bulb_orange').addClass('bulb-glow-orange-after');
			$('body').css('backgroud-color', '#FFF');
			$('body').addClass('peach-after');
			$(this).fadeOut('fast').delay(4000).promise().done(function () {
				$('#bannar_coming').fadeIn('fast');
			});
		});

		$('#bannar_coming').click(function () {
			$('.bannar').addClass('bannar-come');
			$(this).fadeOut('fast').delay(4000).promise().done(function () {
				$('#balloons_flying').fadeIn('fast');
			});
		});

		function createBalloonLoop(selector) {
			return function () {
				var randleft = 1000 * Math.random();
				var randtop = 500 * Math.random();
				$(selector).animate({ left: randleft, bottom: randtop }, 10000, function () {
					createBalloonLoop(selector)();
				});
			};
		}

		$('#balloons_flying').click(function () {
			$('.balloon-border').animate({ top: -500 }, 8000);
			$('#b1,#b4,#b5,#b7,#b8').addClass('balloons-rotate-behaviour-one');
			$('#b2,#b3,#b6').addClass('balloons-rotate-behaviour-two');

			// Position balloons based on screen size
			if ($(window).width() <= 768) {
				// Mobile layout - HBD on top, SHARU on bottom
				$('#b1').animate({ bottom: '50%' }, 1000);
				$('#b2').animate({ bottom: '50%' }, 1200);
				$('#b3').animate({ bottom: '50%' }, 1400);
				$('#b4').animate({ bottom: '20%' }, 1000);
				$('#b5').animate({ bottom: '20%' }, 1200);
				$('#b6').animate({ bottom: '20%' }, 1400);
				$('#b7').animate({ bottom: '20%' }, 1600);
				$('#b8').animate({ bottom: '20%' }, 1800);
			} else {
				// Desktop layout - all balloons rise together
				$('#b1,#b2,#b3,#b4,#b5,#b6,#b7,#b8').animate({ bottom: '100%' }, 2000);
			}

			// Use the reusable function for all balloons
			for (let i = 1; i <= 8; i++) {
				createBalloonLoop('#b' + i)();
			}

			$(this).fadeOut('fast').delay(3000).promise().done(function () {
				$('#cake_fadein').fadeIn('fast');
			});
		});

		$('#cake_fadein').click(function () {
			$('.cake').fadeIn('fast');
			$(this).fadeOut('fast').delay(2000).promise().done(function () {
				$('#light_candle').fadeIn('fast');
			});
		});

		$('#light_candle').click(function () {
			$('.fuego').fadeIn('fast');
			$(this).fadeOut('fast').promise().done(function () {
				$('#wish_message').fadeIn('fast');
			});
		});

		$('#wish_message').click(function () {
			vw = $(window).width() / 2;

			$('#b1,#b2,#b3,#b4,#b5,#b6,#b7,#b8').stop();

			// Check if mobile view
			if ($(window).width() <= 768) {
				// Mobile layout - HBD on top, SHARU on bottom
				$('#b1').attr('id', 'b11').animate({ top: '30%', left: '20%' }, 500);
				$('#b2').attr('id', 'b22').animate({ top: '30%', left: '40%' }, 500);
				$('#b3').attr('id', 'b33').animate({ top: '30%', left: '60%' }, 500);
				$('#b4').attr('id', 'b44').animate({ top: '60%', left: '10%' }, 500);
				$('#b5').attr('id', 'b55').animate({ top: '60%', left: '25%' }, 500);
				$('#b6').attr('id', 'b66').animate({ top: '60%', left: '40%' }, 500);
				$('#b7').attr('id', 'b77').animate({ top: '60%', left: '55%' }, 500);
				$('#b8').attr('id', 'b88').animate({ top: '60%', left: '70%' }, 500);
			} else {
				// Desktop layout - all in a row
				for (let i = 1; i <= 8; i++) {
					$('#b' + i).attr('id', 'b' + i + i).animate({ top: 240, left: vw - 400 + (i * 100) }, 500);
				}
			}

			$('.balloons').css('opacity', '0.9');
			$('.balloons h2').fadeIn(3000);
			$(this).fadeOut('fast').delay(2000).promise().done(function () {
				$('#story').fadeIn('fast');
			});
		});

		$('#story').click(function () {
			$(this).fadeOut('fast');
			$('.cake').fadeOut('fast').promise().done(function () {
				$('.message').fadeIn('fast');
			});

			function msgLoop(i) {
				$("p:nth-child(" + i + ")").fadeOut('slow').delay(1500).promise().done(function () {
					i = i + 1;
					$("p:nth-child(" + i + ")").fadeIn('slow').delay(2000);
					if (i == 50) {
						$("p:nth-child(49)").fadeOut('slow').promise().done(function () {
							$('.cake').fadeIn('fast');
						});
					}
					else {
						msgLoop(i);
					}
				});
			}

			msgLoop(0);
		});
	});
</script>
<style>
	body {

	@-o-keyframes peach_alive {

			background-color: #FFE4B5;

		25% {
			background-color: #FFE4B5;

	@keyframes peach_alive {

		0%,
		50%,

		}

		25% {
			background-color: #FFE4B5;

			background-color: #FFEFD5;
		}
	}

	.bulb {
		width: 50px;
		height: 50px;
		margin: auto;
		background-repeat: no-repeat no-repeat;
		background-position: center 0px;
		background-size: 50px 50px;
	}

	.bulb-holder {
		height: 70px;
	}

	/* Create reusable bulb animation mixin */
	@mixin bulb-glow($color) {
		background-image: url('bulb_#{$color}.png');
		-webkit-animation: bulb_glow_#{$color} linear 5s;
		-moz-animation: bulb_glow_#{$color} linear 5s;
		-o-animation: bulb_glow_#{$color} linear 5s;
		-ms-animation: bulb_glow_#{$color} linear 5s;
		animation: bulb_glow_#{$color} linear 5s;
	}

	@mixin bulb-keyframes($color) {
		@-webkit-keyframes bulb_glow_#{$color} {
			0% {
				background-image: url('bulb.png');
				opacity: 0;
			}

			50% {
				opacity: 1;
			}

			100% {
				background-image: url('bulb_#{$color}.png');
				opacity: 1;
			}
		}

		@-moz-keyframes bulb_glow_#{$color} {
			0% {
				background-image: url('bulb.png');
				opacity: 0;
			}

			50% {
				opacity: 1;
			}

			100% {
				background-image: url('bulb_#{$color}.png');
				opacity: 1;
			}
		}

		@-o-keyframes bulb_glow_#{$color} {
			0% {
				background-image: url('bulb.png');
				opacity: 0;
			}

			50% {
				opacity: 1;
			}

			100% {
				background-image: url('bulb_#{$color}.png');
				opacity: 1;
			}
		}

		@-ms-keyframes bulb_glow_#{$color} {
			0% {
				background-image: url('bulb.png');
				opacity: 0;
			}

			50% {
				opacity: 1;
			}

			100% {
				background-image: url('bulb_#{$color}.png');
				opacity: 1;
			}
		}

		@keyframes bulb_glow_#{$color} {
			0% {
				background-image: url('bulb.png');
				opacity: 0;
			}

			50% {
				opacity: 1;
			}

			100% {
				background-image: url('bulb_#{$color}.png');
				opacity: 1;
			}
		}
	}

	/* Apply to all bulb colors */
	.bulb-glow-yellow {
		@include bulb-glow(yellow);
	}

	.bulb-glow-red {
		@include bulb-glow(red);
	}

	.bulb-glow-blue {
		@include bulb-glow(blue);
	}

	.bulb-glow-green {
		@include bulb-glow(green);
	}

	.bulb-glow-pink {
		@include bulb-glow(pink);
	}

	.bulb-glow-orange {
		@include bulb-glow(orange);
	}

	/* Generate keyframes for all colors */
	@include bulb-keyframes(yellow);
	@include bulb-keyframes(red);
	@include bulb-keyframes(blue);
	@include bulb-keyframes(green);
	@include bulb-keyframes(pink);
	@include bulb-keyframes(orange);

	/* After music bulb animations */
	@mixin bulb-glow-after($color, $duration) {
		background-image: url('bulb_#{$color}.png');
		-webkit-animation: bulb_glow_#{$color}_after linear $duration infinite;
		-moz-animation: bulb_glow_#{$color}_after linear $duration infinite;
		-o-animation: bulb_glow_#{$color}_after linear $duration infinite;
		-ms-animation: bulb_glow_#{$color}_after linear $duration infinite;
		animation: bulb_glow_#{$color}_after linear $duration infinite;
	}

	@mixin bulb-keyframes-after($color) {
		@-webkit-keyframes bulb_glow_#{$color}_after {

			0%,
			100% {
				background-image: url('bulb.png');
			}

			50% {
				background-image: url('bulb_#{$color}.png');
			}
		}

		@-moz-keyframes bulb_glow_#{$color}_after {

			0%,
			100% {
				background-image: url('bulb.png');
			}

			50% {
				background-image: url('bulb_#{$color}.png');
			}
		}

		@-o-keyframes bulb_glow_#{$color}_after {

			0%,
			100% {
				background-image: url('bulb.png');
			}

			50% {
				background-image: url('bulb_#{$color}.png');
			}
		}

		@-ms-keyframes bulb_glow_#{$color}_after {

			0%,
			100% {
				background-image: url('bulb.png');
			}

			50% {
				background-image: url('bulb_#{$color}.png');
			}
		}

		@keyframes bulb_glow_#{$color}_after {

			0%,
			100% {
				background-image: url('bulb.png');
			}

			50% {
				background-image: url('bulb_#{$color}.png');
			}
		}
	}

	.bulb-glow-yellow-after {
		@include bulb-glow-after(yellow, 1s);
	}

	.bulb-glow-red-after {
		@include bulb-glow-after(red, 1.2s);
	}

	.bulb-glow-blue-after {
		@include bulb-glow-after(blue, 1.4s);
	}

	.bulb-glow-green-after {
		@include bulb-glow-after(green, 1.8s);
	}

	.bulb-glow-pink-after {
		@include bulb-glow-after(pink, 2s);
	}

	.bulb-glow-orange-after {
		@include bulb-glow-after(orange, 2.2s);
	}

	@include bulb-keyframes-after(yellow);
	@include bulb-keyframes-after(red);
	@include bulb-keyframes-after(blue);
	@include bulb-keyframes-after(green);
	@include bulb-keyframes-after(pink);
	@include bulb-keyframes-after(orange);

	audio {
		display: none;
	}

	.bannar {
		max-width: 100%;
		-webkit-transform: translate(0px, -500px);
		-moz-transform: translate(0px, -500px);
		-o-transform: translate(0px, -500px);
		-ms-transform: translate(0px, -500px);
		transform: translate(0px, -500px);
	}

	.bannar-come {
		-webkit-animation: bannar_come linear 6s;
		-webkit-transform: translate(0px, 0px);
		-moz-animation: bannar_come linear 6s;
		-moz-transform: translate(0px, 0px);
		-o-animation: bannar_come linear 6s;
		-o-transform: translate(0px, 0px);
		-ms-animation: bannar_come linear 6s;
		-ms-transform: translate(0px, 0px);
		animation: bannar_come linear 6s;
		transform: translate(0px, 0px);
	}

	@-webkit-keyframes bannar_come {
		0% {
			-webkit-transform: translate(0px, -1000px);
		}

		33% {
			-webkit-transform: translate(0px, 0px) rotate(10deg);
		}

		66% {
			-webkit-transform: translate(0px, 100px) rotate(-10deg);
		}

		100% {
			-webkit-transform: translate(0px, 0px);
		}
	}

	@-moz-keyframes bannar_come {
		0% {
			-moz-transform: translate(0px, -1000px);
		}

		33% {
			-moz-transform: translate(0px, 0px) rotate(10deg);
		}

		66% {
			-moz-transform: translate(0px, 100px) rotate(-10deg);
		}

		100% {
			-moz-transform: translate(0px, 0px);
		}
	}

	@-o-keyframes bannar_come {
		0% {
			-o-transform: translate(0px, -1000px);
		}

		33% {
